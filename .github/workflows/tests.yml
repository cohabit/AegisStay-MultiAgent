name: Offline acceptance
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      AEGIS_FORCE_RULES: "1"
      AEGIS_AUTH_ENABLED: "0"
      AEGIS_SITE_PROFILE: standard
      AEGIS_DB_PATH: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify release and capture evidence
        run: python scripts/verify_release.py --output-dir .artifacts/ci
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}
          path: .artifacts/ci
          if-no-files-found: error
          retention-days: 14
      - run: docker build -t aegisstay:test .
